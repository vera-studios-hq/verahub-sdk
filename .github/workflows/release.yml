name: Release

# Tags a Swift SDK release and publishes it as a GitHub release, whose notes name the publisher
# spec the release was built against. Swift Package Manager reads the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The Swift SDK version, such as 0.1.0; it must match VeraHubClient.sdkVersion and have a CHANGELOG.md entry"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version and write the notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not a version"; exit 1; }
          grep -q "public static let sdkVersion = \"$VERSION\"" Sources/VeraHub/VeraHubClient.swift ||
            { echo "::error::VeraHubClient.sdkVersion is not $VERSION"; exit 1; }
          notes="$(awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md)"
          [[ -n "${notes//[[:space:]]/}" ]] || { echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1; }
          commit="$(jq -r .commit spec/source.json)"
          {
            echo "$notes"
            echo
            echo "Built against the publisher spec of VeraHub \`$commit\` (\`spec/publisher.json\`)."
          } >notes.md
          cat notes.md
      - name: Check that this is main and the tag is new
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] ||
            { echo "::error::Releases are made from main, not $GITHUB_REF"; exit 1; }
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null || status=$?
          case "$status" in
            2) ;;
            0) echo "::error::The tag $VERSION already exists"; exit 1 ;;
            *) echo "::error::Cannot check whether the tag $VERSION exists"; exit 1 ;;
          esac
      - name: Check that CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every page of the commit's check runs, not only the first.
          conclusions="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name != "release") | .conclusion // "pending"')"
          if [[ -z "$conclusions" ]]; then
            state=none
          elif grep -qvxE 'success|skipped' <<<"$conclusions"; then
            state=failure
          else
            state=success
          fi
          [[ "$state" == "success" ]] || { echo "::error::CI has not passed on $GITHUB_SHA ($state)"; exit 1; }
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
